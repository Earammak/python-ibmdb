# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Black Duck Security Action allows you to integrate Static Analysis Security Testing (SAST) and Software Composition Analysis (SCA) into your CI/CD pipelines.
# For more information about configuring your workflow,
# read our documentation at https://github.com/blackduck-inc/black-duck-security-scan

name: CI Polaris security scan

on:
  push:
    branches: ["decfloat_issue_1075"]

jobs:
  polaris:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel

      - name: Validate Polaris token secret
        env:
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        run: |
          if [ -z "$POLARIS_ACCESS_TOKEN" ]; then
            echo "::error::POLARIS_ACCESS_TOKEN is not set in GitHub Actions secrets."
            exit 1
          fi
          echo "POLARIS_ACCESS_TOKEN is set. Length: ${#POLARIS_ACCESS_TOKEN} characters."
          if printf '%s' "$POLARIS_ACCESS_TOKEN" | grep -Eq '[[:space:]]'; then
            echo "::error::POLARIS_ACCESS_TOKEN contains whitespace. Paste only the raw token value."
            exit 1
          fi
          if ! printf '%s' "$POLARIS_ACCESS_TOKEN" | grep -Eq '^[A-Z2-7]+=*$'; then
            echo "::error::POLARIS_ACCESS_TOKEN contains characters outside the base32 token format expected by Bridge CLI."
            exit 1
          fi

      - name: Polaris scan
        uses: blackduck-inc/black-duck-security-scan@v2.11.0
        with:
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SAST"

